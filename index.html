<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Super 95 Waremme–Herstal</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600&family=Barlow+Condensed:wght@600;700&display=swap" rel="stylesheet">
<style>
/* Mise en page : bandeau résumé, calcul du plein, puis tableau des pompes dans l'ordre du trajet. */
:root{
  --bg:#f3f4f1; --panel:#ffffff; --ink:#1b2422; --muted:#5d6b68; --line:#d9dedb;
  --accent:#1f4e79;
  --low:#1d7a46; --low-bg:#e2f3e8; --high:#b3261e; --high-bg:#fbe6e4;
  --display:"Barlow Condensed","Arial Narrow",Arial,sans-serif;
  --body:"Barlow","Segoe UI",Roboto,Arial,sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    color-scheme:dark;
    --bg:#131817; --panel:#1c2322; --ink:#e9eeec; --muted:#9aa8a4; --line:#2e3937;
    --accent:#8fbbe6;
    --low:#6fd39a; --low-bg:#17392a; --high:#ff9087; --high-bg:#44201d;
  }
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --bg:#131817; --panel:#1c2322; --ink:#e9eeec; --muted:#9aa8a4; --line:#2e3937;
  --accent:#8fbbe6;
  --low:#6fd39a; --low-bg:#17392a; --high:#ff9087; --high-bg:#44201d;
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.45}
main{max-width:1040px;margin:0 auto;padding:24px 16px 48px;display:flex;flex-direction:column;gap:24px}
h1{font-family:var(--display);font-weight:700;font-size:2.3rem;line-height:1.05;margin:0;text-wrap:balance}
h2{font-family:var(--display);font-weight:600;font-size:1.45rem;margin:0 0 10px;text-wrap:balance}
.sub{color:var(--muted);margin:6px 0 0}
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:12px}
.tile{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:14px 16px;border-left-width:6px}
.tile.low{border-left-color:var(--low)} .tile.high{border-left-color:var(--high)} .tile.gap{border-left-color:var(--accent)}
.tile .lab{color:var(--muted);font-size:.85rem;text-transform:uppercase;letter-spacing:.04em}
.tile .big{font-family:var(--display);font-weight:700;font-size:2.2rem;line-height:1.1;font-variant-numeric:tabular-nums}
.tile.low .big{color:var(--low)} .tile.high .big{color:var(--high)} .tile.gap .big{color:var(--accent)}
.tile .who{font-weight:600} .tile .adr{color:var(--muted);font-size:.9rem}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:16px}
.scroll{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-variant-numeric:tabular-nums}
th,td{padding:8px 10px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}
th{font-size:.8rem;text-transform:uppercase;letter-spacing:.04em;color:var(--muted);font-weight:600;white-space:nowrap}
td.num,th.num{text-align:right;white-space:nowrap}
tr.zone td{background:var(--bg);font-family:var(--display);font-weight:600;font-size:1.05rem;border-bottom:1px solid var(--line)}
tr.low td{background:var(--low-bg)} tr.high td{background:var(--high-bg)}
tr.low td.price{color:var(--low);font-weight:600} tr.high td.price{color:var(--high);font-weight:600}
.pill{display:inline-block;border-radius:999px;padding:1px 9px;font-size:.78rem;font-weight:600;margin-left:6px;white-space:nowrap}
.pill.low{background:var(--low);color:var(--panel)} .pill.high{background:var(--high);color:var(--panel)}
.adr{color:var(--muted);font-size:.9rem}
.up{color:var(--high);font-weight:600} .down{color:var(--low);font-weight:600} .flat{color:var(--muted)}
.old{color:var(--muted);font-size:.8rem}
.gain{color:var(--low);font-weight:600}
.note{color:var(--muted);font-size:.9rem;max-width:70ch}
.err{color:var(--high);font-weight:600}
svg text{font-family:var(--body);fill:var(--muted);font-size:11px}
a{color:var(--accent)}
</style>
</head>
<body>
<main>
  <header>
    <h1>Super 95 entre Waremme et Herstal</h1>
    <p class="sub" id="stamp">Chargement des prix…</p>
  </header>

  <section class="tiles" id="tiles" aria-label="Résumé du jour"></section>

  <section class="panel">
    <h2 id="tankTitle">Coût du plein</h2>
    <div class="scroll"><table id="tank"></table></div>
  </section>

  <section class="panel">
    <h2>Les pompes, dans l'ordre du trajet</h2>
    <div class="scroll"><table id="stations"></table></div>
  </section>

  <section class="panel">
    <h2>Évolution jour après jour</h2>
    <div id="chart"></div>
    <div class="scroll"><table id="hist"></table></div>
  </section>

  <p class="note" id="foot"></p>
</main>

<script>
const eur = (v, d) => v.toLocaleString('fr-BE', {minimumFractionDigits:d, maximumFractionDigits:d}) + ' €';
const dfmt = iso => { const [y,m,d] = iso.split('-'); return d + '/' + m + '/' + y; };
const el = (id) => document.getElementById(id);
const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

function stats(day){
  const vals = Object.values(day.prices).filter(v => typeof v === 'number');
  if(!vals.length) return null;
  const min = Math.min(...vals), max = Math.max(...vals);
  const avg = vals.reduce((a,b)=>a+b,0)/vals.length;
  return {min, max, avg, n: vals.length};
}

function render(data){
  const days = data.history.slice().sort((a,b) => a.date < b.date ? -1 : 1);
  const today = days[days.length-1], prev = days.length > 1 ? days[days.length-2] : null;
  const st = stats(today);
  const byId = Object.fromEntries(data.stations.map(s => [s.id, s]));
  const tank = data.vehicle.tank_l;

  el('stamp').textContent = data.fuel + ' · relevé du ' + dfmt(today.date) + (today.time ? ' à ' + today.time : '') +
    ' · ' + st.n + ' pompes sur ' + data.stations.length + ' · source ' + data.source;

  const lows = data.stations.filter(s => today.prices[s.id] === st.min);
  const highs = data.stations.filter(s => today.prices[s.id] === st.max);
  const who = list => '<div class="who">' + esc(list[0].name) + (list.length > 1 ? ' et ' + (list.length-1) + ' autre' + (list.length > 2 ? 's' : '') : '') +
    '</div><div class="adr">' + esc(list[0].addr) + '</div>';
  el('tiles').innerHTML =
    '<div class="tile low"><div class="lab">Le moins cher</div><div class="big">' + eur(st.min,3) + ' /L</div>' + who(lows) + '</div>' +
    '<div class="tile high"><div class="lab">Le plus cher</div><div class="big">' + eur(st.max,3) + ' /L</div>' + who(highs) + '</div>' +
    '<div class="tile gap"><div class="lab">Gain sur un plein de ' + tank + ' L</div><div class="big">' + eur((st.max-st.min)*tank,2) + '</div>' +
    '<div class="adr">Écart de ' + eur(st.max-st.min,3) + ' par litre entre les deux</div></div>';

  el('tankTitle').textContent = 'Coût du plein : ' + data.vehicle.name + ', réservoir de ' + tank + ' L';
  const fills = [['Plein complet',1],['3/4 de plein',.75],['1/2 plein',.5],['1/4 de plein',.25]];
  el('tank').innerHTML = '<thead><tr><th>Remplissage</th><th class="num">Litres</th><th class="num">Au moins cher</th><th class="num">Au plus cher</th><th class="num">Gain</th></tr></thead><tbody>' +
    fills.map(([lab,f]) => { const l = tank*f; return '<tr><td>' + lab + '</td><td class="num">' + l.toLocaleString('fr-BE') + ' L</td><td class="num">' + eur(l*st.min,2) +
      '</td><td class="num">' + eur(l*st.max,2) + '</td><td class="num gain">' + eur(l*(st.max-st.min),2) + '</td></tr>'; }).join('') + '</tbody>';

  let rows = '<thead><tr><th>Pompe et adresse</th><th class="num">Prix du jour</th><th class="num">Depuis la veille</th><th class="num">Plein ' + tank + ' L</th></tr></thead><tbody>';
  let zone = null;
  for(const s of data.stations){
    if(s.zone !== zone){ zone = s.zone; rows += '<tr class="zone"><td colspan="4">' + esc(zone) + '</td></tr>'; }
    const p = today.prices[s.id];
    const has = typeof p === 'number';
    const cls = has && p === st.min ? 'low' : (has && p === st.max ? 'high' : '');
    let delta = '<span class="flat">—</span>';
    if(has && prev && typeof prev.prices[s.id] === 'number'){
      const d = +(p - prev.prices[s.id]).toFixed(3);
      delta = d > 0 ? '<span class="up">▲ +' + eur(d,3) + '</span>' : d < 0 ? '<span class="down">▼ ' + eur(d,3) + '</span>' : '<span class="flat">= stable</span>';
    }
    const old = today.old && today.old[s.id] ? '<div class="old">prix du ' + dfmt(today.old[s.id]) + '</div>' : '';
    const pill = cls === 'low' ? '<span class="pill low">moins cher</span>' : cls === 'high' ? '<span class="pill high">plus cher</span>' : '';
    rows += '<tr class="' + cls + '"><td><strong>' + esc(s.name) + '</strong>' + pill + '<div class="adr">' + esc(s.addr) + '</div></td>' +
      '<td class="num price">' + (has ? eur(p,3) : 'pas de prix') + old + '</td><td class="num">' + delta + '</td><td class="num">' + (has ? eur(p*tank,2) : '—') + '</td></tr>';
  }
  el('stations').innerHTML = rows + '</tbody>';

  const hs = days.map(d => ({d, s: stats(d)})).filter(x => x.s);
  el('hist').innerHTML = '<thead><tr><th>Jour</th><th class="num">Moins cher</th><th class="num">Plus cher</th><th class="num">Moyenne</th><th class="num">Gain plein ' + tank + ' L</th></tr></thead><tbody>' +
    hs.slice().reverse().map(x => '<tr><td>' + dfmt(x.d.date) + '</td><td class="num down">' + eur(x.s.min,3) + '</td><td class="num up">' + eur(x.s.max,3) +
      '</td><td class="num">' + eur(x.s.avg,3) + '</td><td class="num gain">' + eur((x.s.max-x.s.min)*tank,2) + '</td></tr>').join('') + '</tbody>';

  if(hs.length < 2){
    el('chart').innerHTML = '<p class="note">Le graphique apparaîtra dès le deuxième relevé. Les flèches de la colonne « Depuis la veille » aussi.</p>';
  } else {
    const W = 960, H = 220, L = 52, R = 12, T = 12, B = 28;
    const lo = Math.min(...hs.map(x => x.s.min)) - 0.01, hi = Math.max(...hs.map(x => x.s.max)) + 0.01;
    const x = i => L + (W-L-R) * (hs.length === 1 ? .5 : i/(hs.length-1));
    const y = v => T + (H-T-B) * (1 - (v-lo)/(hi-lo));
    const line = (k, col) => '<polyline fill="none" stroke="' + col + '" stroke-width="2.5" points="' + hs.map((h,i) => x(i) + ',' + y(h.s[k])).join(' ') + '"/>' +
      '<circle r="4" fill="' + col + '" cx="' + x(hs.length-1) + '" cy="' + y(hs[hs.length-1].s[k]) + '"/>';
    let grid = '';
    for(let g = 0; g <= 4; g++){ const v = lo + (hi-lo)*g/4; grid += '<line x1="' + L + '" x2="' + (W-R) + '" y1="' + y(v) + '" y2="' + y(v) + '" stroke="var(--line)"/><text x="' + (L-6) + '" y="' + (y(v)+4) + '" text-anchor="end">' + v.toFixed(3) + '</text>'; }
    const step = Math.max(1, Math.ceil(hs.length/8));
    const labs = hs.map((h,i) => (i % step === 0 || i === hs.length-1) ? '<text x="' + x(i) + '" y="' + (H-8) + '" text-anchor="middle">' + h.d.date.slice(8) + '/' + h.d.date.slice(5,7) + '</text>' : '').join('');
    el('chart').innerHTML = '<div class="scroll"><svg viewBox="0 0 ' + W + ' ' + H + '" width="100%" role="img" aria-label="Prix le plus bas et le plus haut par jour">' + grid + line('max','var(--high)') + line('avg','var(--muted)') + line('min','var(--low)') + labs + '</svg></div>' +
      '<p class="note"><span class="down">Vert</span> : pompe la moins chère du jour. <span class="up">Rouge</span> : la plus chère. Gris : moyenne des pompes.</p>';
  }

  el('foot').innerHTML = 'Prix relevés une fois par jour sur ' + esc(data.source) + ', pompe par pompe. Une pompe affichée au prix maximum officiel peut simplement ne pas avoir communiqué son prix réel. ' +
    'Sélection : pompes proches du trajet Waremme → E40 → Loncin → Rocourt → Herstal. Le détour réel de chaque pompe n\'a pas été mesuré.';
}

fetch('data.json', {cache:'no-store'}).then(r => { if(!r.ok) throw new Error(r.status); return r.json(); }).then(render)
  .catch(e => { el('stamp').innerHTML = '<span class="err">Les prix n\'ont pas pu être chargés (' + esc(e.message) + '). Rechargez la page.</span>'; });
</script>
</body>
</html>
